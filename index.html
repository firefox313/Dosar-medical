<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jurnal medical de familie</title>
<meta name="theme-color" content="#C23B63">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jurnal medical">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>

/* Concept: aplicație mobile-first, un profil per membru; culoarea membrului colorează interfața.
   Carduri albe pe fundal roz-pal, titluri în Bricolage Grotesque, text în Figtree. */
:root{
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#FBF6F4; --surface:#FFFFFF; --surface2:#F5ECE9; --ink:#2A2230; --muted:#6B6073; --line:#EADFDB;
  --m0:#C23B63; --m1:#13776C; --m2:#4558B8; --m3:#A8590F; --m4:#7A3FA0; --m5:#2F6E9E; --on-m:#FFFFFF;
  --ok:#2B7A4B; --warn:#9A5B00; --bad:#B3261E;
  --shadow:0 1px 2px rgba(42,34,48,.06),0 8px 22px rgba(42,34,48,.06);
  --scrim:rgba(30,18,34,.45);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171218; --surface:#221B25; --surface2:#2C232F; --ink:#F4EEF3; --muted:#B5AABB; --line:#3B3140;
  --m0:#FF8FAB; --m1:#5ED0BF; --m2:#A5B4FF; --m3:#F2B36B; --m4:#D2A6F2; --m5:#8CC4F0; --on-m:#1B1220;
  --ok:#6FD39A; --warn:#FFC266; --bad:#FF8F86;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171218; --surface:#221B25; --surface2:#2C232F; --ink:#F4EEF3; --muted:#B5AABB; --line:#3B3140;
  --m0:#FF8FAB; --m1:#5ED0BF; --m2:#A5B4FF; --m3:#F2B36B; --m4:#D2A6F2; --m5:#8CC4F0; --on-m:#1B1220;
  --ok:#6FD39A; --warn:#FFC266; --bad:#FF8F86;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--m);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

#app{--m:var(--m0);--m-tint:color-mix(in srgb,var(--m) 11%,var(--surface));--m-soft:color-mix(in srgb,var(--m) 22%,var(--surface));
  max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:110px}


/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 0 8px}
.top-row{display:flex;align-items:center;gap:10px;min-height:40px}
.brand{font-family:var(--font-display);font-weight:700;font-size:20px;flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.brand .logo{width:28px;height:28px;border-radius:9px;background:var(--m);color:var(--on-m);display:grid;place-items:center}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:5px 10px;border-radius:999px}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.pagetitle{font-size:20px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:12px;background:var(--m);color:var(--on-m);font-weight:700;min-height:42px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--m-tint);color:var(--m)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.members{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.members::-webkit-scrollbar{display:none}
.mem{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;white-space:nowrap;flex:none}
.mem[aria-pressed="true"]{background:var(--m);color:var(--on-m);border-color:var(--m)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:var(--font-display);background:var(--mc,var(--m));color:var(--on-m);flex:none;font-size:14px}
.av.lg{width:64px;height:64px;font-size:28px}
.av.sm{width:22px;height:22px;font-size:11px}
.demo{background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));border-radius:12px;padding:8px 12px;font-size:13px;margin:6px 0 4px;display:flex;gap:8px;align-items:flex-start}

/* blocks */
main{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h2{font-size:18px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3{font-size:15px;margin-bottom:6px}
.sub{color:var(--muted);font-size:13px}
.lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.hero{display:flex;gap:14px;align-items:center}
.hero h1{font-size:30px;line-height:1.05}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--ink);white-space:nowrap}
.chip.m{background:var(--m-tint);color:var(--m)}
.chip.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok)}
.chip.warn{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 13%,var(--surface));color:var(--bad)}
.fchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.fchips::-webkit-scrollbar{display:none}
.fc{padding:7px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap;flex:none}
.fc[aria-pressed="true"]{background:var(--m);color:var(--on-m);border-color:var(--m)}
.qk{display:grid;grid-template-columns:1fr;gap:10px}
.qk .it{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:baseline;font-size:14px}
.qk .it b{font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;box-shadow:var(--shadow)}
.tile .ti{width:36px;height:36px;border-radius:11px;background:var(--m-tint);color:var(--m);display:grid;place-items:center}
.tile b{font-family:var(--font-display);font-size:16px}
.tile .meta{font-size:12.5px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:12px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;min-width:0}
.row > .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.datebox{width:48px;flex:none;text-align:center;background:var(--m-tint);color:var(--m);border-radius:12px;padding:6px 0;line-height:1.1}
.datebox b{display:block;font-family:var(--font-display);font-size:20px}
.datebox span{font-size:11px;font-weight:700;text-transform:uppercase}
.ic{flex:none}
.sep{height:1px;background:var(--line);margin:10px 0}
.year{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--muted);margin:8px 0 -2px}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}

/* forms */
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13px;margin-bottom:12px}
input[type=text],input[type=date],input[type=time],input[type=file],input[type=search],input[type=password],input[type=number],select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-height:44px;font-weight:400}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--m);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:6px 0}
.chk input{width:20px;height:20px;accent-color:var(--m);margin-top:1px;flex:none}
.search{position:relative}
.search input{padding-left:40px}
.search .ic{position:absolute;left:12px;top:12px;color:var(--muted)}
.sw{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--m)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{padding:9px 6px;border-radius:11px;font-weight:700;font-size:13px;text-align:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--m);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.setrow .t{font-weight:600}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .band{fill:color-mix(in srgb,var(--ok) 13%,transparent)}
.chart .gband{fill:color-mix(in srgb,var(--m) 11%,transparent)}
.chart .p50{stroke:var(--muted);stroke-dasharray:4 3;fill:none;stroke-width:1}
.chart .pe{stroke:var(--muted);fill:none;stroke-width:1;opacity:.6}
.chart .ln{stroke:var(--m);fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--m);stroke:var(--surface);stroke-width:2}
.chart .pt.bad{fill:var(--surface);stroke:var(--bad);stroke-width:2.6}
.chart .pt.sel{stroke:var(--ink)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .flagt{fill:var(--bad);font-weight:700}
.readout{background:var(--m-tint);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:8px}
.bar{display:grid;grid-template-columns:110px 1fr 28px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.bar .tr{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--m);border-radius:99px}
.bar b{text-align:right}
.ins{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);width:100%}
.ins .ib{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none}
.ins.ok .ib{background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:var(--ok)}
.ins.warn .ib{background:color-mix(in srgb,var(--warn) 17%,var(--surface));color:var(--warn)}
.ins.bad .ib{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}
.ins.info .ib{background:var(--m-tint);color:var(--m)}

/* docs */
.docs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.doc .th{height:92px;background:var(--m-tint);display:grid;place-items:center;color:var(--m);position:relative}
.doc .th .ft{position:absolute;top:8px;left:8px}
.doc .tx{padding:10px}
.doc .tx b{font-size:13.5px;font-weight:600;display:block;overflow-wrap:anywhere}
.paper{background:#fff;color:#222;border-radius:6px;padding:18px;box-shadow:0 2px 14px rgba(0,0,0,.2);font-size:12px;line-height:1.5}
.paper h3{font-family:var(--font-display);font-size:17px;color:#222}
.paper table{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:11.5px}
.paper th,.paper td{border-bottom:1px solid #ddd;padding:4px 4px;text-align:left;vertical-align:top}
.paper h4{margin:12px 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#555}
.paper .sk{height:8px;background:#e7e2e6;border-radius:4px;margin:7px 0}
.paper .foot{margin-top:10px;font-size:10px;color:#777}
.paperwrap{overflow-x:auto}
pre.out{background:var(--surface2);border-radius:12px;padding:12px;font-size:12px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin:0}
.callout{border-radius:14px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;background:var(--m-tint)}
.callout.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface))}
.callout.bad{background:color-mix(in srgb,var(--bad) 11%,var(--surface))}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:10px;align-items:center;font-size:14px}
.steps .s0{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.steps li.done .s0{border-color:var(--ok);background:var(--ok);display:grid;place-items:center;color:var(--surface)}
.steps li.run .s0{border-color:var(--m);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* tabs, sheet, toast */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:11px;font-weight:600;color:var(--muted);text-align:center}
.tab[aria-current="page"]{color:var(--m);background:var(--m-tint)}
#sheet{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.panel{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:min(640px,100%);max-height:92%;overflow:auto;background:var(--bg);color:var(--ink);
  border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));outline:0}
.panel .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;position:sticky;top:-16px;background:var(--bg);padding:6px 0;z-index:2}
.panel .ph h2{font-size:20px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:50;max-width:min(560px,calc(100% - 32px));text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.tiles{grid-template-columns:1fr}.qk .it{grid-template-columns:1fr;gap:0}.bar{grid-template-columns:90px 1fr 24px}}

#app[data-c="1"]{--m:var(--m1)}#app[data-c="2"]{--m:var(--m2)}#app[data-c="3"]{--m:var(--m3)}#app[data-c="4"]{--m:var(--m4)}#app[data-c="5"]{--m:var(--m5)}
#app{--m-tint:color-mix(in srgb,var(--m) 11%,var(--surface))}
/* completări etapa 1 */
[hidden]{display:none!important}
.rowbtn{text-align:left}
.row{text-align:left;cursor:pointer}
div.row{cursor:default}
.lnk{color:var(--m);font-weight:600;text-decoration:underline;text-underline-offset:2px;text-align:left}
.lnkchip{cursor:pointer}
.ti{width:36px;height:36px;border-radius:11px;background:var(--m-tint);color:var(--m);display:grid;place-items:center;flex:none}
.tile{text-align:left;cursor:pointer}
.tile.flat{box-shadow:none;cursor:default;background:var(--surface2);border-color:transparent}
.tile.flat b{font-size:20px}
.layer{position:absolute;inset:0}
.panel.wide{width:min(900px,100%)}
.pb{min-width:0}
.fgrid{display:flex;flex-wrap:wrap;gap:12px 10px}
.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13px;flex:1 1 100%;min-width:0}
.f.half{flex:1 1 calc(50% - 5px)}
.f .sub{font-weight:400}
.fl{font-weight:600;font-size:13px}
.full{flex:1 1 100%}
.selrow{display:flex;gap:8px}
.selrow select{flex:1;min-width:0}
.iconbtn.sm{width:44px;height:44px;border-radius:12px}
.multi{display:flex;flex-wrap:wrap;gap:6px}
.mi{display:inline-flex}
.mi input{position:absolute;opacity:0;pointer-events:none}
.mi span{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;cursor:pointer}
.mi input:checked + span{background:var(--m);color:var(--on-m);border-color:var(--m)}
.mi input:focus-visible + span{outline:2px solid var(--m);outline-offset:2px}
.vrows{display:flex;flex-direction:column;gap:10px}
.vrow{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.vrow input{min-height:40px;width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:400}
.vr2{display:grid;grid-template-columns:1.2fr .8fr .8fr .8fr 40px;gap:6px;align-items:center}
.vr2 .iconbtn{width:40px;height:40px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.fbtns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.danger{color:var(--bad)}
.btn.danger-solid{background:var(--bad);color:#fff}
.btn.danger{color:var(--bad)}
.chx{margin-left:4px;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%}
.inl{display:flex;gap:8px;margin-top:10px}
.inl input{flex:1}
.more summary{cursor:pointer;font-weight:600;color:var(--muted);padding:6px 0}
.road{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.doc{cursor:pointer;text-align:left}
.doc .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.doc .th .ft{z-index:1}
.paper .anx img{display:block}
.paper .sk0{font-size:10px;color:#777}
.demo.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.top-row .btn{flex:none}
@media (max-width:420px){.vr2{grid-template-columns:1fr 1fr 1fr 1fr 40px}.vr2 input{padding:8px 6px}}

/* ───── liste implicite ───── */
const DEF_SPECS=['Medicină de familie','Pediatrie','Cardiologie','Endocrinologie','Gastroenterologie','Alergologie și imunologie','Dermatologie','Ortopedie','Neurologie','Psihiatrie','Psihologie','ORL','Oftalmologie','Stomatologie','Ginecologie','Urologie','Nefrologie','Pneumologie','Reumatologie','Hematologie','Oncologie','Chirurgie generală','Radiologie și imagistică','Recuperare medicală','Nutriție și dietetică','Medicina muncii','Altele'];
const DEF_TYPES=['Consultație','Control','Ecografie','Analize','Radiografie','RMN','CT','EKG','Vaccin','Tratament / procedură','Telemedicină','Alte investigații'];
const FACILITY_KINDS=['Clinică privată','Cabinet','Spital','Laborator','Farmacie','Centru de imagistică','Altceva'];

/* ───── baza de date locală (IndexedDB) ───── */
const DATA=['persons','facilities','doctors','conditions','visits','symptoms','labreports','labs','meds','vaccines','measures','docs','notes','reminders','wellness','habits'];
const STORES=DATA.concat(['meta','blobs']);
const DB={};DATA.forEach(s=>DB[s]=[]);
let META={id:'meta',specialties:DEF_SPECS.slice(),visitTypes:DEF_TYPES.slice(),currency:'RON',genericCal:true,paramAliases:{},paramTheme:{},tomb:[],created:Date.now()};
let idb=null,dbError='',persisted=false;
function openDB(){return new Promise(res=>{try{
  const r=indexedDB.open('jurnal-medical',2);
  r.onupgradeneeded=()=>{STORES.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})})};
  r.onsuccess=()=>{const db=r.result;db.onversionchange=()=>{try{db.close()}catch(e){}try{location.reload()}catch(e){}};res(db)};
  r.onerror=()=>res(null);
  r.onblocked=()=>{try{const m=document.getElementById('main');if(m)m.innerHTML='<div class="card">Actualizez baza de date locală. Închide celelalte file sau ferestre ale aplicației și redeschide-o.</div>'}catch(e){}}}catch(e){res(null)}})}
const idbStore=(s,m)=>idb.transaction(s,m).objectStore(s);
function idbAll(s){return new Promise(res=>{try{const q=idbStore(s,'readonly').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])}catch(e){res([])}})}
function idbWrite(s,fn){if(!idb)return;try{const t=idb.transaction(s,'readwrite');fn(t.objectStore(s));t.onerror=()=>{dbError='Salvarea locală a eșuat.'};t.onabort=()=>{dbError='Salvarea locală a eșuat (spațiu insuficient?).'}}catch(e){dbError='Salvarea locală a eșuat.'}}
async function loadAll(){
  idb=await openDB();if(!idb){dbError='Browserul nu permite salvarea locală. Datele se pierd la închidere.';return}
  for(const s of DATA)DB[s]=await idbAll(s);
  const m=await idbAll('meta');if(m.length){META=Object.assign(META,m[0]);if(!META.tomb)META.tomb=[];if(!META.paramAliases)META.paramAliases={};if(!META.paramTheme)META.paramTheme={}}
  try{if(navigator.storage&&navigator.storage.persist)persisted=await navigator.storage.persist()}catch(e){}
}
function save(type,rec){hk();rec.updatedAt=Date.now();if(!rec.id)rec.id=uid();const a=DB[type],i=a.findIndex(x=>x.id===rec.id);if(i>=0)a[i]=rec;else a.push(rec);idbWrite(type,s=>s.put(rec));return rec}
function removeRec(type,id){hk();const a=DB[type],i=a.findIndex(x=>x.id===id);if(i>=0)a.splice(i,1);idbWrite(type,s=>s.delete(id));META.tomb.push({t:type,id:id,at:Date.now()});saveMeta()}
function saveMeta(){hk();META.updatedAt=Date.now();idbWrite('meta',s=>s.put(META))}
function hk(){setTimeout(()=>{try{if(typeof onLocalChange==='function')onLocalChange()}catch(e){}},0)}
function putBlob(id,blob){hk();idbWrite('blobs',s=>s.put({id:id,blob:blob,type:blob.type,size:blob.size}))}
function getBlob(id){return new Promise(res=>{if(!idb)return res(null);try{const q=idbStore('blobs','readonly').get(id);q.onsuccess=()=>res(q.result?q.result.blob:null);q.onerror=()=>res(null)}catch(e){res(null)}})}
function delBlob(id){idbWrite('blobs',s=>s.delete(id))}
async function wipeAll(){
  DATA.forEach(s=>DB[s]=[]);META=Object.assign(META,{specialties:DEF_SPECS.slice(),visitTypes:DEF_TYPES.slice(),paramAliases:{},paramTheme:{},tomb:[]});
  if(idb){for(const s of STORES.filter(x=>x!=='meta')){await new Promise(r=>{try{const t=idb.transaction(s,'readwrite');t.objectStore(s).clear();t.oncomplete=r;t.onerror=r;t.onabort=r}catch(e){r()}})}}
  saveMeta()}
const blobToB64=b=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>res('');r.readAsDataURL(b)});
const b64ToBlob=(b64,type)=>{const bin=atob(b64),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:type||'application/octet-stream'})};
async function exportAll(){
  const out={app:'jurnal-medical',version:1,exported:new Date().toISOString(),meta:META,data:{},blobs:[]};
  DATA.forEach(s=>out.data[s]=DB[s]);
  for(const d of DB.docs){const b=await getBlob(d.id);if(b)out.blobs.push({id:d.id,type:b.type,b64:await blobToB64(b)})}
  return new Blob([JSON.stringify(out)],{type:'application/json'});
}
async function importAll(text){
  const o=JSON.parse(text);if(o.app!=='jurnal-medical'||!o.data)throw new Error('Fișier necunoscut.');
  await wipeAll();META=Object.assign(META,o.meta||{});if(!META.tomb)META.tomb=[];saveMeta();
  for(const s of DATA){DB[s]=(o.data[s]||[]);DB[s].forEach(r=>idbWrite(s,st=>st.put(r)))}
  for(const b of (o.blobs||[]))putBlob(b.id,b64ToBlob(b.b64,b.type));
}

function specsOf(type,x){
  const s=new Set(),add=n=>{if(n)s.add(n)};
  if(type==='condition'){add(x.specialty);return s}
  if(type==='visit'){add(x.specialty);if(!x.specialty&&x.doctorId){const d=get('doctors',x.doctorId);if(d&&d.specialties&&d.specialties.length===1)add(d.specialties[0])}return s}
  add(x.specialty);
  (x.conditionIds||[]).forEach(id=>{const c=get('conditions',id);if(c)add(c.specialty)});
  if(x.visitId){const v=get('visits',x.visitId);if(v)specsOf('visit',v).forEach(add)}
  return s}
const inSpec=(type,x,sp)=>specsOf(type,x).has(sp);
function specData(pid,sp){
  const r={conditions:[],visits:[],reports:[],symptoms:[],meds:[],docs:[],notes:[]};
  r.conditions=mine('conditions',pid).filter(x=>inSpec('condition',x,sp)).sort((a,b)=>(condActive(a)?0:1)-(condActive(b)?0:1));
  r.visits=mine('visits',pid).filter(x=>inSpec('visit',x,sp)).sort(cmpDateDesc);
  r.reports=mine('labreports',pid).filter(x=>inSpec('report',x,sp)).sort(cmpDateDesc);
  r.symptoms=mine('symptoms',pid).filter(x=>inSpec('symptom',x,sp)).sort((a,b)=>(b.start||'')<(a.start||'')?-1:1);
  r.meds=mine('meds',pid).filter(x=>inSpec('med',x,sp)).sort((a,b)=>(b.start||'')<(a.start||'')?-1:1);
  r.docs=mine('docs',pid).filter(x=>inSpec('doc',x,sp)).sort(cmpDateDesc);
  r.notes=mine('notes',pid).filter(x=>inSpec('note',x,sp)).sort(cmpDateDesc);
  r.doctors=DB.doctors.filter(d=>r.visits.some(v=>v.doctorId===d.id)).sort(cmpName);
  r.otherDoctors=DB.doctors.filter(d=>(d.specialties||[]).includes(sp)&&!r.doctors.includes(d)).sort(cmpName);
  const fs=new Set();r.visits.forEach(v=>v.facilityId&&fs.add(v.facilityId));r.reports.forEach(v=>v.facilityId&&fs.add(v.facilityId));
  r.facilities=Array.from(fs).map(id=>get('facilities',id)).filter(Boolean);
  r.cost=r.visits.filter(v=>v.status==='efectuată'&&v.cost!=null).reduce((a,v)=>a+v.cost,0);
  r.total=r.conditions.length+r.visits.length+r.reports.length+r.symptoms.length+r.meds.length+r.docs.length+r.notes.length;
  return r}
function usedSpecs(pid){const s=new Set();
  mine('conditions',pid).forEach(x=>specsOf('condition',x).forEach(n=>s.add(n)));mine('visits',pid).forEach(x=>specsOf('visit',x).forEach(n=>s.add(n)));
  mine('labreports',pid).forEach(x=>specsOf('report',x).forEach(n=>s.add(n)));mine('meds',pid).forEach(x=>specsOf('med',x).forEach(n=>s.add(n)));
  mine('symptoms',pid).forEach(x=>specsOf('symptom',x).forEach(n=>s.add(n)));return s}

const AMAP={};ALIAS_LIST.forEach(a=>{AMAP[norm(a[0])]=a[0];a.slice(1).forEach(x=>{AMAP[norm(x)]=a[0]})});
function pcanon(name){
  const n=norm(name).trim();if(!n)return name;
  const ua=META.paramAliases;if(ua&&ua[n])return ua[n];
  if(AMAP[n])return AMAP[n];
  const toks=n.split(/[()\/,]+/).map(x=>x.trim()).filter(Boolean);
  if(toks.length>1)for(const t of toks){if(ua&&ua[t])return ua[t];if(AMAP[t])return AMAP[t]}
  return name}

/* ștergere cu curățarea legăturilor */
function cascade(type,id){
  const strip=(c,k)=>DB[c].slice().forEach(r=>{if(Array.isArray(r[k])&&r[k].indexOf(id)>=0){r[k]=r[k].filter(x=>x!==id);save(c,r)}});
  const unset=(c,k)=>DB[c].slice().forEach(r=>{if(r[k]===id){r[k]=null;save(c,r)}});
  if(type==='condition')['visits','symptoms','labreports','meds','notes','docs'].forEach(c=>strip(c,'conditionIds'));
  if(type==='visit'){['symptoms','labreports','meds','docs','vaccines','notes'].forEach(c=>unset(c,'visitId'));DB.reminders.filter(r=>r.refType==='visit'&&r.refId===id).forEach(r=>removeRec('reminders',r.id))}
  if(type==='doctor'){unset('visits','doctorId');unset('persons','gpId')}
  if(type==='facility'){unset('visits','facilityId');unset('labreports','facilityId');strip('doctors','facilityIds')}
  if(type==='labreport'){DB.labs.filter(l=>l.reportId===id).forEach(l=>removeRec('labs',l.id));unset('docs','reportId')}
  if(type==='doc'){delBlob(id);unset('notes','docId')}
  if(type==='person'){DATA.filter(c=>c!=='persons').forEach(c=>DB[c].filter(r=>r.personId===id).forEach(r=>{if(c==='docs')delBlob(r.id);removeRec(c,r.id)}))}
}
function delEntity(type,id){cascade(type,id);removeRec(COLL[type],id)}

  if(v.next&&v.status!=='anulată'){const r=ex||{personId:v.personId,refType:'visit',refId:v.id,cal:false};r.date=v.next;r.title='Control – '+(v.reason||('vizita din '+fd(v.date)));r.kind='Control';save('reminders',r)}

function upcoming(pid){

function calUrl(kind,title,dateS,timeS,pname,notes){
  const text=META.genericCal?(kind||'Medical')+' – '+pname:title;let dates;
  if(timeS){const d=D(dateS),h=timeS.split(':');d.setHours(+h[0],+(h[1]||0));const e=new Date(d.getTime()+45*60000);
    const f=x=>x.getFullYear()+p2(x.getMonth()+1)+p2(x.getDate())+'T'+p2(x.getHours())+p2(x.getMinutes())+'00';dates=f(d)+'/'+f(e)}
  else dates=dateS.replace(/-/g,'')+'/'+addDays(dateS,1).replace(/-/g,'');
  let tz='';try{tz='&ctz='+encodeURIComponent(Intl.DateTimeFormat().resolvedOptions().timeZone)}catch(e){}
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(text)+'&dates='+dates+tz+'&details='+encodeURIComponent(META.genericCal?'Jurnal medical':(notes||'Jurnal medical'))}

/* costuri */
function costStats(pids){
  const vs=DB.visits.filter(v=>pids.indexOf(v.personId)>=0&&v.cost!=null);
  const done=vs.filter(v=>v.status==='efectuată'),plan=vs.filter(v=>v.status==='planificată');
  const sum=a=>a.reduce((s,v)=>s+v.cost,0),byYear={},bySpec={},byType={};
  done.forEach(v=>{const y=(v.date||'').slice(0,4);byYear[y]=(byYear[y]||0)+v.cost;
    const sp=Array.from(specsOf('visit',v))[0]||'Fără specialitate';bySpec[sp]=(bySpec[sp]||0)+v.cost;
    const ty=(v.types&&v.types.length?v.types:['Fără tip']);ty.forEach(t=>{byType[t]=(byType[t]||0)+v.cost/ty.length})});
  return {total:sum(done),planned:sum(plan),byYear,bySpec,byType,done:done.sort(cmpDateDesc),plan}}

/* observații automate */
function insights(pid){
  const out=[],p=get('persons',pid);
  paramsOf(pid).forEach(n=>{const s0=seriesOf(pid,n),l=s0[s0.length-1],s=s0.filter(x=>x.lab===l.lab&&x.u===l.u),pr=s[s.length-2],f=flag(l.v,l.lo,l.hi);
    if(f)out.push({k:'bad',t:`${n}: ${nv(l.v)} ${l.u}, ${f==='low'?'sub':'peste'} limita ${nv(f==='low'?l.lo:l.hi)} de pe buletin (${fd(l.d)}).`,go:{t:'param',n}});
    else if(pr&&flag(pr.v,pr.lo,pr.hi))out.push({k:'ok',t:`${n}: a revenit în interval, ${nv(l.v)} ${l.u} față de ${nv(pr.v)} la ${fd(pr.d)}.`,go:{t:'param',n}});
    if(s.length>=4){const a=s.slice(-4).map(x=>x.v),dn=a.every((v,i)=>i===0||v<a[i-1]),up=a.every((v,i)=>i===0||v>a[i-1]);
      if(dn)out.push({k:'warn',t:`${n}: tendință descrescătoare în ultimele 4 analize (${a.map(nv).join(' → ')} ${l.u}).`,go:{t:'param',n}});
      if(up)out.push({k:'info',t:`${n}: tendință crescătoare în ultimele 4 analize (${a.map(nv).join(' → ')} ${l.u}).`,go:{t:'param',n}})}});
  DB.vaccines.filter(v=>v.personId===pid&&v.status==='restant').forEach(v=>out.push({k:'warn',t:`Vaccin restant: ${v.name}${v.age?' (recomandat la '+v.age+')':''}.`,go:{t:'vaccinuri'}}));
  const t=todayS(),soon=upcoming(pid).filter(u=>u.date<=addDays(t,30)).slice(0,2);
  soon.forEach(u=>out.push({k:'info',t:`În curând: ${u.title}, ${fd(u.date)}.`,go:u.go}));
  const act=mine('conditions',pid).filter(condActive).length,am=mine('meds',pid).filter(medActive).length;
  if(act||am)out.push({k:'info',t:`${act} afecțiuni active și ${am} medicamente în curs.`,go:{t:'conditions'}});
  const g=mine('measures',pid).filter(m=>m.height!=null&&m.weight!=null).sort(cmpDateAsc);
  if(g.length>2&&isChild(p)){const L=g[g.length-1],t0=+D(L.date)-365*864e5,P0=g.reduce((a,b)=>Math.abs(+D(b.date)-t0)<Math.abs(+D(a.date)-t0)?b:a),dt=(+D(L.date)-+D(P0.date))/(365*864e5);

  const label=q==='doctor'?rec.name+((rec.specialties||[]).length?' · '+rec.specialties.join(', '):''):rec.name;
  if(el.tagName==='SELECT'){const o=document.createElement('option');o.value=rec.id;o.textContent=label;el.appendChild(o);el.value=rec.id;el.dispatchEvent(new Event('change',{bubbles:true}))}
  else{const m=$('.multi',el);if(m){const n=$('.nomulti',m);if(n)n.remove();m.insertAdjacentHTML('beforeend',multiItem(m.dataset.k,[rec.id,label],true))}}}

const chip=(t,c)=>`<span class="chip ${c||''}">${t}</span>`;
const dbox=s=>{const d=D(s);return d?`<span class="datebox"><b>${d.getDate()}</b><span>${MON[d.getMonth()].replace('.','')} ${String(d.getFullYear()).slice(2)}</span></span>`:'<span class="datebox"><b>–</b><span>fără dată</span></span>'};

const sect=(title,count,add,body)=>`<section class="card"><h2>${esc(title)}${count!=null?` <span class="chip">${count}</span>`:''}<span class="grow"></span>${add||''}</h2>${body}</section>`;
const grp=(title,items,fn)=>items.length?`<div class="year">${esc(title)}</div><div class="list">${items.map(fn).join('')}</div>`:'';
const emptyCard=t=>`<div class="card empty">${t}</div>`;

function calAnchor(ct,cid){
  const rec=get(COLL[ct],cid);if(!rec)return '';const p=get('persons',rec.personId)||{name:''};let url;
  if(ct==='visit')url=calUrl('Vizită medicală',rec.reason||'Vizită medicală',rec.date,rec.time,p.name,rec.notes);
  else if(ct==='reminder')url=calUrl(rec.kind||'Control',rec.title,rec.date,'',p.name,'');
  else url=calUrl('Vaccin','Vaccin: '+rec.name,rec.date,'',p.name,'');
  return `<a class="btn ${rec.cal?'soft':'ghost'} sm" href="${esc(url)}" target="_blank" rel="noopener" data-act="calmark" data-ct="${ct}" data-cid="${cid}">${ic('cal',14)}${rec.cal?'Deschis în Calendar':'Adaugă în Google Calendar'}</a>`}

function vaxRow(v){

function docCard(d){return `<button class="doc" data-act="doc" data-id="${d.id}"><div class="th" data-th="${d.id}">${ic(d.type==='pdf'?'pdf':d.type==='audio'?'mic':'img',34)}<span class="chip ft">${d.type==='pdf'?'PDF':d.type==='audio'?'Audio':'Poză'}</span></div><div class="tx"><b>${esc(d.name)}</b><span class="sub">${fd(d.date)} · ${esc(d.tag||'')}</span></div></button>`}
function noteLinks(n){const d=get('docs',n.docId),v=get('visits',n.visitId);return (d?' · document: '+esc(d.name):'')+(v&&!d?' · vizita din '+fd(v.date):'')}

function upRow(u){

function vCondition(v){

  const has=x=>(x.conditionIds||[]).indexOf(c.id)>=0,pf={conditionIds:[c.id]};
  const vs=mine('visits',c.personId).filter(has).sort(cmpDateDesc),sy=mine('symptoms',c.personId).filter(has),ms=mine('meds',c.personId).filter(has),rp=mine('labreports',c.personId).filter(has).sort(cmpDateDesc),ds=mine('docs',c.personId).filter(has).sort(cmpDateDesc),ns=mine('notes',c.personId).filter(has);
  return `<div class="card"><div class="chips">${condActive(c)?chip('Activă','ok'):chip('Încheiată')}${c.chronic?chip('Cronică','m'):''}${c.specialty?`<button class="chip m lnkchip" data-act="open" data-v="${J({t:'spec',name:c.specialty})}">${esc(c.specialty)}</button>`:''}</div>

    ${c.notes?`<div class="sep"></div><p>${esc(c.notes)}</p>`:''}<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">${editBtn('condition',c.id)}<button class="btn ghost sm" data-act="exgo" data-cond="${c.id}">${ic('file',14)}Export PDF pe afecțiune</button></div></div>
   ${sect('Vizite',vs.length,btnAdd('visit','Vizită',pf),vs.length?`<div class="list">${vs.map(x=>visitRow(x)).join('')}</div>`:'<div class="sub">Nicio vizită legată.</div>')}
   ${sect('Simptome',sy.length,btnAdd('symptom','Simptom',pf),sy.length?`<div class="list">${sy.map(symRow).join('')}</div>`:'<div class="sub">Niciun simptom legat.</div>')}
   ${sect('Analize',rp.length,btnAdd('labreport','Analize',pf),rp.length?`<div class="list">${rp.map(reportRow).join('')}</div>`:'<div class="sub">Nicio analiză legată.</div>')}
   ${sect('Medicamente',ms.length,btnAdd('med','Medicament',pf),ms.length?`<div class="list">${ms.map(medRow).join('')}</div>`:'<div class="sub">Niciun medicament legat.</div>')}
   ${ds.length?sect('Documente',ds.length,'',`<div class="docs">${ds.map(docCard).join('')}</div>`):''}${ns.length?sect('Note',ns.length,'',`<div class="list">${ns.map(noteRow).join('')}</div>`):''}`}
function durText(a,b){const d=Math.round((D(b)-D(a))/864e5);if(d<31)return d+' zile';if(d<730)return Math.round(d/30.4)+' luni';return nf(d/365.25,1)+' ani'}

/* ───── vizite ───── */
function vVisits(){

  return grp('Planificate',l.filter(v=>v.status==='planificată').sort(cmpDateAsc),v=>visitRow(v))+grp('Efectuate',l.filter(v=>v.status==='efectuată').sort(cmpDateDesc),v=>visitRow(v))+grp('Anulate',l.filter(v=>v.status==='anulată').sort(cmpDateDesc),v=>visitRow(v))}
function vVisit(v){
  const x=get('visits',v.id);if(!x)return emptyCard('Vizita nu mai există.');

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">${editBtn('visit',x.id)}${x.status==='planificată'?`<button class="btn sm" data-act="markdone" data-id="${x.id}">${ic('check',14)}Marchează efectuată</button>${calAnchor('visit',x.id)}`:''}</div></div>
   <div class="card"><div class="kv">${kvRow('Medic',d?lnk({t:'doctor',id:d.id},d.name):'')}${kvRow('Unitate',f?lnk({t:'facility',id:f.id},f.name):'')}${kvRow('Cost',x.cost!=null?'<b>'+money(x.cost)+'</b>'+(x.costNote?' · '+esc(x.costNote):''):'')}</div>
    ${x.diagnosis?`<div class="sep"></div><div class="lbl">Diagnostic</div><p>${esc(x.diagnosis)}</p>`:''}${x.treatment?`<div class="sep"></div><div class="lbl">Tratament recomandat</div><p style="white-space:pre-wrap">${esc(x.treatment)}</p>`:''}${x.notes?`<div class="sep"></div><div class="lbl">Concluzii și note</div><p style="white-space:pre-wrap">${esc(x.notes)}</p>`:''}

   ${x.next?`<div class="card"><h2>Următorul control</h2><div class="row" style="border:0;padding:0">${dbox(x.next)}<div class="grow"><div class="t">${fd(x.next)}</div></div>${rem?calAnchor('reminder',rem.id):''}</div></div>`:''}
   ${sect('Analize',rp.length,btnAdd('labreport','Analize',pf),rp.length?`<div class="list">${rp.map(reportRow).join('')}</div>`:'<div class="sub">Nicio analiză legată.</div>')}
   ${sect('Medicamente prescrise',ms.length,btnAdd('med','Medicament',pf),ms.length?`<div class="list">${ms.map(medRow).join('')}</div>`:'<div class="sub">Niciun medicament legat.</div>')}
   ${sect('Simptome',sy.length,btnAdd('symptom','Simptom',pf),sy.length?`<div class="list">${sy.map(symRow).join('')}</div>`:'<div class="sub">Niciun simptom legat.</div>')}
   ${sect('Documente',ds.length,btnAdd('doc','Document',pf),ds.length?`<div class="docs">${ds.map(docCard).join('')}</div><div style="margin-top:10px"><button class="btn ghost sm" data-act="ai-visitdocs" data-id="${x.id}">${ic('spark',14)}Interpretează documentele vizitei cu AI</button></div>`:'<div class="sub">Niciun document atașat.</div>')}

function vGrowth(){
  const p=person(),g=mine('measures').sort(cmpDateAsc);if(!g.length)return emptyCard('Nicio măsurătoare încă.');
  const kinds=[['h','Înălțime','height','cm'],['w','Greutate','weight','kg']];if(g.some(x=>x.pulse!=null))kinds.push(['p','Puls','pulse','bpm']);if(g.some(x=>x.sys!=null))kinds.push(['s','Tensiune sist.','sys','mmHg'],['d','Tensiune diast.','dia','mmHg']);
  if(!kinds.some(k=>k[0]===S.gr))S.gr='h';
  const kd=kinds.find(k=>k[0]===S.gr),pts=g.filter(x=>x[kd[2]]!=null).map(x=>({date:x.date,d:x.date,v:x[kd[2]],u:kd[3]}));
  let chart='',ro='',stats='',note='';
  if(!pts.length)chart='<div class="sub">Nicio valoare pentru acest indicator.</div>';
  else if((kd[0]==='h'||kd[0]==='w')&&hasBands(p,pts)){const c=growthChart(kd[0],pts,p);chart=c.svg;ro=`<b>${fd(c.sel.d)}</b> · ${nf(c.sel.a)} ani · ${nf(c.sel.v)} ${kd[3]} · aprox. percentila P${pctOf(kd[0],c.sel.a,c.sel.v)}`;
    note=`<div class="callout warn" style="margin-top:10px">${ic('info')}<div>Curbele P3, P50 și P97 sunt orientative. Versiunea următoare folosește tabelele oficiale OMS.</div></div>`}
  else{const c=tsChart(pts,{key:'gr_'+kd[0],label:'Evoluție '+kd[1]});chart=c.svg;ro=`<b>${fd(c.sel.d)}</b> · ${nf(c.sel.v)} ${kd[3]}`;
    if(isChild(p)&&(kd[0]==='h'||kd[0]==='w'))note=`<div class="callout" style="margin-top:10px">${ic('info')}<div>Curbele de percentile sunt disponibile doar pentru fete între 2 și 9 ani, deocamdată.</div></div>`}
  const hw=g.filter(x=>x.height!=null&&x.weight!=null);
  if(hw.length){const L=hw[hw.length-1],t0=+D(L.date)-365*864e5,P0=hw.reduce((a,b)=>Math.abs(+D(b.date)-t0)<Math.abs(+D(a.date)-t0)?b:a),dt=(+D(L.date)-+D(P0.date))/(365*864e5);
    stats=`<div class="tiles" style="margin-top:12px"><div class="tile flat"><span class="lbl">Ultima măsurătoare</span><b class="num">${nf(L.height)} cm · ${nf(L.weight)} kg</b><span class="meta">${fd(L.date)}</span></div>
     <div class="tile flat"><span class="lbl">IMC</span><b class="num">${nf(L.weight/Math.pow(L.height/100,2))} kg/m²</b><span class="meta">${isChild(p)?'la copii se interpretează pe percentile':'din ultimele valori'}</span></div>
     ${dt>0.5?`<div class="tile flat"><span class="lbl">Ritm, ultimul an</span><b class="num">${nf((L.height-P0.height)/dt)} cm / an</b><span class="meta">${nf((L.weight-P0.weight)/dt)} kg / an</span></div>`:''}</div>`}
  return `<div class="card"><div class="seg" role="group">${kinds.map(k=>`<button aria-pressed="${S.gr===k[0]}" data-act="gk" data-v="${k[0]}">${k[1]}</button>`).join('')}</div><div style="margin-top:10px">${chart}</div>${ro?`<div class="readout num">${ro}</div>`:''}${note}${stats}</div>
   <div class="card"><h2>Înregistrări</h2><div class="list">${g.slice().reverse().map(x=>open({sheet:'measure',id:x.id},`<div class="grow"><div class="t num">${fd(x.date)}</div><div class="s num">${[x.height!=null?nf(x.height)+' cm':'',x.weight!=null?nf(x.weight)+' kg':'',x.pulse!=null?'puls '+nf(x.pulse,0):'',x.sys!=null?'TA '+nf(x.sys,0)+'/'+nf(x.dia,0):''].filter(Boolean).join(' · ')}</div></div>${x.source&&x.source!=='manual'?chip(esc(x.source)):''}${ic('chev',16)}`)).join('')}</div></div>`}

/* ───── istoric ───── */
function filtered(){
  const f=S.f,ids=f.fam?DB.persons.map(p=>p.id):[S.pid];let ev=events(ids);
  if(f.types.length)ev=ev.filter(e=>f.types.indexOf(e.type)>=0);
  if(f.spec!=='all')ev=ev.filter(e=>e.specs.indexOf(f.spec)>=0);
  if(f.doc!=='all')ev=ev.filter(e=>e.doctorId===f.doc);
  if(f.cond!=='all')ev=ev.filter(e=>(e.conditionIds||[]).indexOf(f.cond)>=0);
  if(f.period!=='all'){const lim=new Date();lim.setFullYear(lim.getFullYear()-(f.period==='1y'?1:3));ev=ev.filter(e=>D(e.date)>=lim)}
  const toks=norm(f.q).split(/\s+/).filter(Boolean).map(t=>t.length>5?t.slice(0,t.length-2):t);
  if(toks.length)ev=ev.filter(e=>{const h=norm([e.title,e.sub,e.text,e.specs.join(' '),dname(e.doctorId),(e.conditionIds||[]).map(cname).join(' ')].join(' '));return toks.every(t=>h.indexOf(t)>=0)});
  return ev}

  return `<div class="sub">${ev.length} rezultate</div><div class="list">${h}</div>`}

    o.analize=Object.keys(ps).map(n=>{const a=ps[n],l=a[a.length-1];return {parametru:n,unitate:l.u,valori:a.map(x=>({data:x.date,valoare:x.v,unitate:x.u,referinta:refText(x.lo,x.hi),laborator:lbl(x.lab)}))}})}

  const ks=Object.keys(META.paramAliases||{});
  return `<div class="card"><h2>Denumiri de analize</h2><p class="sub" style="margin-bottom:8px">Denumirile românești și cele internaționale ale analizelor uzuale sunt grupate automat (de ex. Leucocite și WBC). Dacă un parametru nu s-a grupat, deschide-l din Analize și apasă „Grupează cu alt parametru”.</p>${ks.length?`<div class="list">${ks.map(k=>`<div class="row"><div class="grow"><div class="t">${esc(k)}</div><div class="s">grupat la: ${esc(META.paramAliases[k])}</div></div><button class="btn ghost sm" data-act="pungroup" data-k="${esc(k)}">Desparte</button></div>`).join('')}</div>`:'<div class="sub">Nicio grupare făcută de tine.</div>'}</div>`}

/* ═════ 45 · sincronizare prin Google Drive (cu criptare opțională) ═════
   Fiecare înregistrare e un fișier mic în folderul partajat (r_<id>.json), documentele sunt b_<id>,
   setările comune m_meta.json, iar config.json spune dacă folderul e criptat.
   Regula la conflict: câștigă modificarea mai recentă a aceleiași înregistrări. */
const SCOPE='https://www.googleapis.com/auth/drive';
const DRV='https://www.googleapis.com/drive/v3/files';
const LSG=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const LSS=(k,v)=>{try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const SY={cfg:Object.assign({cid:'',folderName:'Jurnal medical familie',folderId:'',remember:true,keyJwk:null},LSG('jm-sync',{})),map:LSG('jm-syncmap',{}),last:LSG('jm-synclast',0),
  key:null,conf:null,busy:false,inter:false,err:'',prog:'',applying:false};
let TOK=LSG('jm-tok',null),SYT=null;
const saveCfg=()=>LSS('jm-sync',SY.cfg),saveMap=()=>LSS('jm-syncmap',SY.map);
const tokOk=()=>!!(TOK&&TOK.e>Date.now()+60000);
const syOn=()=>!!SY.cfg.folderId;
const te=new TextEncoder(),td=new TextDecoder();

/* ───── Google: autentificare ───── */
function loadGis(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();
  const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=()=>res();s.onerror=()=>rej(new Error('Nu pot încărca Google. Ești conectat la internet?'));document.head.appendChild(s)})}
async function getToken(){
  if(tokOk())return TOK.t;
  if(!SY.inter)throw new Error('NEED_AUTH');
  if(!SY.cfg.cid)throw new Error('Lipsește Client ID-ul Google.');
  await loadGis();
  return new Promise((res,rej)=>{
    const tc=google.accounts.oauth2.initTokenClient({client_id:SY.cfg.cid,scope:SCOPE,
      callback:r=>{if(r.error)return rej(new Error('Google a refuzat conectarea ('+r.error+').'));TOK={t:r.access_token,e:Date.now()+(r.expires_in||3600)*1000};LSS('jm-tok',TOK);res(TOK.t)},
      error_callback:()=>rej(new Error('Fereastra Google a fost închisă sau blocată. Încearcă din nou.'))});
    tc.requestAccessToken({prompt:''})})}
async function errText(r){try{const j=await r.json();return 'Google: '+((j.error&&j.error.message)||r.status)}catch(e){return 'Eroare Google '+r.status}}
async function gapi(url,opt,n){
  n=n||0;const t=await getToken();
  let r;try{r=await fetch(url,Object.assign({},opt,{headers:Object.assign({Authorization:'Bearer '+t},(opt&&opt.headers)||{})}))}catch(e){throw new Error('Nu există conexiune la internet.')}
  if(r.status===401&&n<1){TOK=null;LSS('jm-tok',null);return gapi(url,opt,n+1)}
  if((r.status===429||r.status>=500)&&n<3){await new Promise(z=>setTimeout(z,900*(n+1)));return gapi(url,opt,n+1)}
  return r}
async function jget(url){const r=await gapi(url);if(!r.ok)throw new Error(await errText(r));return r.json()}
const qs='&supportsAllDrives=true&includeItemsFromAllDrives=true';

/* ───── folder și fișiere ───── */
async function listCandidates(){
  const q=encodeURIComponent("mimeType='application/vnd.google-apps.folder' and name='"+SY.cfg.folderName.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"' and trashed=false");
  return (await jget(DRV+'?q='+q+'&fields=files(id,name,owners(emailAddress))&pageSize=20'+qs)).files||[]}
async function createFolder(){
  const r=await gapi(DRV+'?fields=id,name',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:SY.cfg.folderName,mimeType:'application/vnd.google-apps.folder'})});
  if(!r.ok)throw new Error(await errText(r));return r.json()}
async function listRemote(){
  const out={};let pt='';
  do{const q=encodeURIComponent("'"+SY.cfg.folderId+"' in parents and trashed=false");
    const j=await jget(DRV+'?q='+q+'&fields=nextPageToken,files(id,name,modifiedTime,size)&pageSize=1000'+qs+(pt?'&pageToken='+pt:''));
    (j.files||[]).forEach(f=>{out[f.name]=f});pt=j.nextPageToken}while(pt);
  return out}
async function putFile(name,body,mime,existingId){
  if(existingId){
    const r=await gapi('https://www.googleapis.com/upload/drive/v3/files/'+existingId+'?uploadType=media&fields=id,modifiedTime'+qs,{method:'PATCH',headers:{'Content-Type':mime},body});
    if(!r.ok)throw new Error(await errText(r));return r.json()}
  const b='jm'+uid(),meta=JSON.stringify({name,parents:[SY.cfg.folderId]});
  const body2=new Blob(['--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+b+'\r\nContent-Type: '+mime+'\r\n\r\n',body,'\r\n--'+b+'--'],{type:'multipart/related; boundary='+b});
  const r=await gapi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime'+qs,{method:'POST',body:body2});
  if(!r.ok)throw new Error(await errText(r));return r.json()}
async function getFile(id){const r=await gapi(DRV+'/'+id+'?alt=media'+qs);if(!r.ok)throw new Error(await errText(r));return new Uint8Array(await r.arrayBuffer())}
async function delRemote(f){
  const r=await gapi(DRV+'/'+f.id+'?'+qs.slice(1),{method:'DELETE'});
  if(r.ok||r.status===404)return;
  /* dacă nu avem voie să ștergem fișierul altcuiva, îl golim și îl marcăm ca șters */
  await putFile(f.name,f.name.indexOf('r_')===0?'{"deleted":1}':'',f.name.indexOf('r_')===0?'application/json':'application/octet-stream',f.id)}

/* ───── criptare (AES-GCM, cheie din parolă cu PBKDF2) ───── */
const b64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw,salt){
  const km=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(salt),iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['encrypt','decrypt'])}
async function encBytes(u8){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},SY.key,u8)),o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return o}
async function decBytes(u8){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8.subarray(0,12)},SY.key,u8.subarray(12)))}
async function tryUnlock(pw){
  const key=await deriveKey(pw,SY.conf.salt);const k0=SY.key;SY.key=key;
  try{if(td.decode(await decBytes(unb64(SY.conf.check)))!=='jm-ok')throw 0}catch(e){SY.key=k0;return false}
  if(SY.cfg.remember){SY.cfg.keyJwk=await crypto.subtle.exportKey('jwk',key);saveCfg()}return true}
async function restoreKey(){
  if(SY.key||!SY.cfg.keyJwk)return;
  try{const key=await crypto.subtle.importKey('jwk',SY.cfg.keyJwk,{name:'AES-GCM'},true,['encrypt','decrypt']);const k0=SY.key;SY.key=key;
    try{if(td.decode(await decBytes(unb64(SY.conf.check)))!=='jm-ok')throw 0}catch(e){SY.key=k0}}catch(e){}}

async function packRec(o){const s=JSON.stringify(o);return SY.conf.enc?{body:await encBytes(te.encode(s)),mime:'application/octet-stream'}:{body:s,mime:'application/json'}}
async function unpackRec(u8){
  if(SY.key){try{return {c:JSON.parse(td.decode(await decBytes(u8))),enc:true}}catch(e){}}
  return {c:JSON.parse(td.decode(u8)),enc:false}}

/* ───── date locale ───── */
const SYNC_TYPES=DATA.filter(x=>x!=='labs');
function localItems(){const m={};SYNC_TYPES.forEach(t=>DB[t].forEach(r=>{m['r_'+r.id+'.json']={t,r}}));return m}
function putLocal(t,rec){const a=DB[t],i=a.findIndex(x=>x.id===rec.id);if(i>=0)a[i]=rec;else a.push(rec);idbWrite(t,s=>s.put(rec))}
function removeLocal(t,id){const a=DB[t],i=a.findIndex(x=>x.id===id);if(i>=0)a.splice(i,1);idbWrite(t,s=>s.delete(id));
  if(t==='docs')delBlob(id);
  if(t==='labreports')DB.labs.filter(l=>l.reportId===id).forEach(l=>{const j=DB.labs.indexOf(l);if(j>=0)DB.labs.splice(j,1);idbWrite('labs',s=>s.delete(l.id))})}
function contentOf(t,r){const o={t,rec:r};if(t==='labreports')o.labs=DB.labs.filter(l=>l.reportId===r.id);return o}
function applyContent(c){
  if(c.deleted||!DB[c.t])return false;
  putLocal(c.t,c.rec);
  if(c.t==='labreports'){DB.labs.filter(l=>l.reportId===c.rec.id).forEach(l=>{const j=DB.labs.indexOf(l);if(j>=0)DB.labs.splice(j,1);idbWrite('labs',s=>s.delete(l.id))});(c.labs||[]).forEach(l=>putLocal('labs',l))}
  return true}
function hasBlob(id){return new Promise(res=>{if(!idb)return res(false);try{const q=idbStore('blobs','readonly').count(id);q.onsuccess=()=>res(q.result>0);q.onerror=()=>res(false)}catch(e){res(false)}})}
function pendingCount(){let n=0;SYNC_TYPES.forEach(t=>DB[t].forEach(r=>{const s=SY.map['r_'+r.id+'.json'];if(!s||(r.updatedAt||0)>s.ut)n++}));return n+(META.tomb||[]).length}
async function pool(jobs,n,onStep){let i=0,done=0,fail=null;
  await Promise.all(Array.from({length:n},async()=>{while(i<jobs.length&&!fail){const j=jobs[i++];try{await j();done++;if(onStep)onStep(done,jobs.length)}catch(e){fail=fail||e}}}));
  if(fail)throw fail}

/* ───── configurația folderului ───── */
async function loadConfig(remote){
  const f=remote['config.json'];
  if(!f){SY.conf={v:1,enc:false};const r=await putFile('config.json',JSON.stringify(SY.conf),'application/json');remote['config.json']={id:r.id,name:'config.json',modifiedTime:r.modifiedTime};return}
  SY.conf=JSON.parse(td.decode(await getFile(f.id)));
  if(SY.conf.enc){await restoreKey();if(!SY.key)throw new Error('NEED_PW')}}

/* ───── sincronizarea propriu-zisă ───── */
async function syncNow(inter){
  if(SY.busy||!syOn())return;
  SY.busy=true;SY.inter=!!inter;SY.err='';SY.prog='';refreshSyncUi();SY.applying=true;
  try{
    await getToken();
    const remote=await listRemote();await loadConfig(remote);
    const local=localItems(),map=SY.map,conf=SY.conf,wantEnc=!!conf.enc,stats={up:0,down:0,del:0},jobs=[];
    const up=async(name,t,r,rf)=>{const p=await packRec(contentOf(t,r)),res=await putFile(name,p.body,p.mime,rf&&rf.id);map[name]={fid:res.id,mt:res.modifiedTime,ut:r.updatedAt||0,enc:wantEnc};stats.up++};
    const pull=async(name,rf,t,r)=>{ /* t,r: înregistrarea locală, dacă există */
      const {c,enc}=await unpackRec(await getFile(rf.id)),sm=map[name];
      if(c.deleted){if(r&&sm&&(r.updatedAt||0)>sm.ut)return up(name,t,r,rf);if(r)removeLocal(t,r.id);delete map[name];stats.del++;return}
      const ru=(c.rec&&c.rec.updatedAt)||0;
      if(r&&(r.updatedAt||0)>ru)return up(name,t,r,rf);
      if(!r||ru>(r.updatedAt||0)){applyContent(c);stats.down++}
      map[name]={fid:rf.id,mt:rf.modifiedTime,ut:ru,enc}};
    /* 1. ștergeri făcute pe acest dispozitiv */
    for(const tb of (META.tomb||[])){
      if(tb.t==='labs')continue;const rn='r_'+tb.id+'.json',bn='b_'+tb.id;
      if(remote[rn]){const f=remote[rn];jobs.push(()=>delRemote(f));delete remote[rn];delete map[rn]}
      if(remote[bn]){const f=remote[bn];jobs.push(()=>delRemote(f));delete remote[bn];delete map[bn]}}
    /* 2. înregistrări locale */
    for(const name in local){
      const {t,r}=local[name],sm=map[name],rf=remote[name];
      if(!rf){if(sm&&(r.updatedAt||0)<=sm.ut)jobs.push(async()=>{removeLocal(t,r.id);delete map[name];stats.del++});else jobs.push(()=>up(name,t,r))}
      else if(!sm)jobs.push(()=>pull(name,rf,t,r));
      else{const rc=rf.modifiedTime!==sm.mt,lc=(r.updatedAt||0)>sm.ut||(!!sm.enc!==wantEnc);
        if(rc)jobs.push(()=>pull(name,rf,t,r));else if(lc)jobs.push(()=>up(name,t,r,rf))}}
    /* 3. înregistrări doar în Drive */
    for(const name in remote){
      if(name.indexOf('r_')!==0||local[name])continue;
      const rf=remote[name];if(+rf.size===0)continue;
      jobs.push(()=>pull(name,rf,null,null))}
    await pool(jobs,4,(d,n)=>{SY.prog=d+' / '+n;refreshSyncUi()});
    /* 4. setări comune */
    {const name='m_meta.json',rf=remote[name],sm=map[name],mine=()=>({specialties:META.specialties,visitTypes:META.visitTypes,currency:META.currency,genericCal:META.genericCal,paramAliases:META.paramAliases||{},paramTheme:META.paramTheme||{},updatedAt:META.updatedAt||0});
      const upM=async()=>{const p=await packRec({t:'meta',rec:mine()}),res=await putFile(name,p.body,p.mime,rf&&rf.id);map[name]={fid:res.id,mt:res.modifiedTime,ut:META.updatedAt||0,enc:wantEnc}};
      const pullM=async()=>{const {c,enc}=await unpackRec(await getFile(rf.id)),ru=(c.rec&&c.rec.updatedAt)||0;
        if(ru>(META.updatedAt||0)){['specialties','visitTypes','currency','genericCal','paramAliases','paramTheme'].forEach(k=>{if(c.rec[k]!=null)META[k]=c.rec[k]});META.updatedAt=ru;idbWrite('meta',s=>s.put(META))}
        else if((META.updatedAt||0)>ru)return upM();
        map[name]={fid:rf.id,mt:rf.modifiedTime,ut:ru,enc}};
      if(!rf)await upM();else if(!sm||rf.modifiedTime!==sm.mt)await pullM();else if((META.updatedAt||0)>sm.ut||(!!sm.enc!==wantEnc))await upM()}
    /* 5. documente (poze, PDF) */
    const bj=[];
    for(const d of DB.docs.slice()){
      const name='b_'+d.id,rf=remote[name],sm=map[name],has=await hasBlob(d.id);
      if(has&&(!rf||(sm&&!!sm.enc!==wantEnc)))bj.push(async()=>{
        const b=await getBlob(d.id);if(!b)return;const raw=new Uint8Array(await b.arrayBuffer());
        const res=await putFile(name,wantEnc?await encBytes(raw):raw,wantEnc?'application/octet-stream':(d.mime||'application/octet-stream'),rf&&rf.id);
        map[name]={fid:res.id,mt:res.modifiedTime,ut:0,enc:wantEnc};stats.up++});
      else if(!has&&rf&&+rf.size>0)bj.push(async()=>{
        let u=await getFile(rf.id),enc=false;if(wantEnc){try{u=await decBytes(u);enc=true}catch(e){}}
        putBlob(d.id,new Blob([u],{type:d.mime||'application/octet-stream'}));map[name]={fid:rf.id,mt:rf.modifiedTime,ut:0,enc};stats.down++})}
    await pool(bj,3,(d,n)=>{SY.prog='documente '+d+' / '+n;refreshSyncUi()});
    /* 6. curățenie */
    META.tomb=[];idbWrite('meta',s=>s.put(META));
    SY.last=Date.now();LSS('jm-synclast',SY.last);saveMap();
    SY.stats=stats;
    if(stats.down||stats.del)render(true);
  }catch(e){
    saveMap();
    if(e.message==='NEED_AUTH')SY.err='Apasă „Sincronizează acum” ca să te reconectezi la Google.';
    else if(e.message==='NEED_PW'){SY.err='Folderul e criptat. Introdu parola comună.';if(inter)askPassword(false)}
    else SY.err=e.message||String(e)
  }finally{SY.busy=false;SY.applying=false;SY.prog='';refreshSyncUi();
    if(!SY.err&&syOn()&&tokOk()&&pendingCount()>0&&!SY.retried){SY.retried=true;setTimeout(()=>syncNow(false),1500)}else SY.retried=false}}

/* ───── legătura cu restul aplicației ───── */
function onLocalChange(){
  if(SY.applying){return}
  if(syOn()&&tokOk()){clearTimeout(SYT);SYT=setTimeout(()=>syncNow(false),4000)}
  refreshSyncUi()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&syOn()&&tokOk()&&Date.now()-SY.last>120000)syncNow(false)});

function syncChip(){
  if(!syOn())return ['Salvat pe dispozitiv',''];
  if(SY.busy)return ['Se sincronizează…','run'];
  if(SY.err)return ['Sincronizare eșuată','bad'];
  const n=pendingCount();
  if(n)return [tokOk()?'De sincronizat · '+n:'Apasă pentru sincronizare','warn'];
  if(!SY.last)return ['Apasă pentru sincronizare','warn'];
  const d=new Date(SY.last);return ['Sincronizat '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),'']}
function refreshSyncUi(){
  const c=$('.sync');if(c){const s=syncChip();c.innerHTML=`<span class="dot ${s[1]}"></span>${esc(s[0])}`}
  const k=$('#sycard');if(k)k.innerHTML=syncCardInner()}

function syncCardInner(){
  const on=syOn();
  if(!on)return `<h2>Sincronizare Google Drive</h2><p class="sub" style="margin-bottom:12px">Datele se copiază într-un folder din Drive-ul tău, partajat cu soția. Nimeni altcineva nu le vede și nu trec prin alt server. Pe al doilea telefon sau pe laptop, conectezi același folder și pornești cu aplicația goală, ca să nu apară profiluri duble.</p>
    <label class="f">Client ID Google<input type="text" id="sy-cid" value="${esc(SY.cfg.cid)}" placeholder="xxxx.apps.googleusercontent.com" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label class="f">Numele folderului din Drive<input type="text" id="sy-folder" value="${esc(SY.cfg.folderName)}" autocomplete="off"></label>
    <button class="btn block" data-act="sy-connect">${ic('cloud',16)}Conectează Google Drive</button>${SY.err?`<div class="callout bad" style="margin-top:10px">${ic('alert',16)}<div>${esc(SY.err)}</div></div>`:''}`;
  const cf=SY.conf,last=SY.last?fd(new Date(SY.last).toISOString().slice(0,10))+', '+new Date(SY.last).toTimeString().slice(0,5):'încă nu';
  return `<h2>Sincronizare Google Drive ${ic('cloud',18)}</h2>
    <div class="kv" style="margin-bottom:10px"><span>Folder</span><span>${esc(SY.cfg.folderName)}</span><span>Ultima sincronizare</span><span>${esc(last)}</span><span>De trimis</span><span>${pendingCount()} modificări</span></div>
    ${SY.busy?`<div class="callout">${ic('cloud')}<div>Se sincronizează… ${esc(SY.prog)}</div></div>`:''}
    ${SY.err?`<div class="callout bad" style="margin-top:8px">${ic('alert',16)}<div>${esc(SY.err)}</div></div>`:''}
    ${!SY.busy&&SY.stats&&!SY.err?`<div class="sub">Ultima rulare: ${SY.stats.up} trimise, ${SY.stats.down} primite${SY.stats.del?', '+SY.stats.del+' șterse':''}.</div>`:''}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn" data-act="sy-now"${SY.busy?' disabled':''}>${ic('cloud',16)}Sincronizează acum</button><button class="btn ghost" data-act="sy-disc">Deconectează</button></div>
    ${cf?`<div class="sep"></div><div class="setrow"><div><div class="t">Criptare cu parola comună</div><div class="sub">${cf.enc?'Activă: fișierele din Drive sunt ilizibile fără parolă.':'Oprită: fișierele din Drive sunt text simplu, vizibile oricui are acces la folder.'}</div></div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${cf.enc?`<button class="btn ghost sm" data-act="sy-enc-off">Oprește criptarea</button>`:`<button class="btn ghost sm" data-act="sy-enc-on">Activează criptarea</button>`}</div>
      ${cf.enc?`<div class="setrow"><div><div class="t">Ține minte parola pe acest dispozitiv</div><div class="sub">Dacă o oprești, ți-o cere la fiecare deschidere.</div></div><button class="sw" role="switch" aria-checked="${!!SY.cfg.remember}" data-act="sy-rem" aria-label="Comutator"></button></div>`:''}`:''}
    <p class="sub" style="margin-top:10px">Aplicația se sincronizează automat după fiecare modificare, cât timp conexiunea Google e activă (cam o oră). Apoi apeși „Sincronizează acum”.</p>`}
const syncCard=()=>`<div class="card" id="sycard">${syncCardInner()}</div>`;

/* ───── acțiuni din interfață ───── */
function askPassword(create){
  openPanel(create?'Alege parola comună':'Parola comună',`<p style="margin-bottom:12px">${create?'Aceeași parolă o vei introduce și pe celelalte dispozitive. <b>Nu poate fi recuperată</b>: dacă o uiți, datele criptate din Drive nu se mai pot citi (copia de rezervă de pe telefon rămâne bună).':'Folderul e criptat. Introdu parola comună a familiei.'}</p>
    <form data-pw="${create?'new':'ask'}"><label class="f">Parola<input type="password" name="pw" autocomplete="${create?'new-password':'current-password'}"></label>${create?`<label class="f">Repetă parola<input type="password" name="pw2" autocomplete="new-password"></label>`:''}<div class="fbtns"><button class="btn block" type="submit">${create?'Activează criptarea':'Deblochează'}</button></div></form>`)}
async function pwSubmit(f){
  const pw=f.elements.pw.value,create=f.dataset.pw==='new';
  if(pw.length<8){toast('Parola trebuie să aibă cel puțin 8 caractere');return}
  if(create&&f.elements.pw2.value!==pw){toast('Parolele nu coincid');return}
  const btn=$('button[type=submit]',f);btn.disabled=true;btn.textContent='Se calculează…';
  try{
    if(create){
      SY.inter=true;const remote=await listRemote();await loadConfig(remote).catch(e=>{if(e.message!=='NEED_PW')throw e});
      if(SY.conf&&SY.conf.enc){closeAllPanels();toast('Criptarea e deja activă. Introdu parola existentă.');askPassword(false);return}
      const salt=b64(crypto.getRandomValues(new Uint8Array(16)));SY.key=await deriveKey(pw,salt);
      SY.conf={v:1,enc:true,salt,check:b64(await encBytes(te.encode('jm-ok')))};
      if(SY.cfg.remember){SY.cfg.keyJwk=await crypto.subtle.exportKey('jwk',SY.key);saveCfg()}
      await putFile('config.json',JSON.stringify(SY.conf),'application/json',remote['config.json']&&remote['config.json'].id);
      closeAllPanels();toast('Criptarea e activă. Rescriu fișierele…');syncNow(true)}
    else{
      if(!SY.conf){const remote=await listRemote();await loadConfig(remote).catch(e=>{if(e.message!=='NEED_PW')throw e})}
      if(await tryUnlock(pw)){closeAllPanels();syncNow(true)}else{toast('Parolă greșită');btn.disabled=false;btn.textContent='Deblochează'}}
  }catch(e){toast(e.message==='NEED_AUTH'?'Conectează-te mai întâi la Google':e.message);btn.disabled=false;btn.textContent=create?'Activează criptarea':'Deblochează'}}

  switch(a){
    case 'sy-connect':syConnect();break;
    case 'sy-now':syncNow(true);break;
    case 'sy-chip':if(syOn())syncNow(true);else goTab('setari');break;
    case 'sy-create':try{SY.inter=true;setFolder(await createFolder())}catch(e){toast(e.message)}break;
    case 'sy-pick':setFolder({id:el.dataset.id});break;
    case 'sy-disc':SY.cfg.folderId='';SY.cfg.keyJwk=null;SY.key=null;SY.conf=null;SY.map={};SY.err='';TOK=null;LSS('jm-tok',null);saveCfg();saveMap();render(true);toast('Deconectat. Datele rămân pe acest dispozitiv.');break;
    case 'sy-rem':SY.cfg.remember=!SY.cfg.remember;if(!SY.cfg.remember)SY.cfg.keyJwk=null;else if(SY.key)SY.cfg.keyJwk=await crypto.subtle.exportKey('jwk',SY.key);saveCfg();refreshSyncUi();break;
    case 'sy-enc-on':if(!tokOk()){toast('Apasă mai întâi „Sincronizează acum”');break}askPassword(true);break;
    case 'sy-enc-off':
      if(!tokOk()){toast('Apasă mai întâi „Sincronizează acum”');break}
      openPanel('Oprești criptarea?',`<p style="margin-bottom:14px">Fișierele din Drive vor fi rescrise ca text simplu, vizibil oricui are acces la folder. Celelalte dispozitive vor continua fără parolă.</p><div class="fbtns"><button class="btn danger-solid block" data-act="sy-enc-off-go">Oprește criptarea</button><button class="btn ghost block" data-act="close">Renunț</button></div>`);break;

  }}

/* ───── apel către API ───── */
async function claude(body){
  if(!AI.key)throw new Error('Adaugă mai întâi cheia API în Setări, la „AI”.');
  let r;
  try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':AI.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(Object.assign({model:AI.model,max_tokens:4096},body))})}
  catch(e){throw new Error('Nu pot contacta Anthropic. Ești conectat la internet?')}
  if(!r.ok){let m='';try{m=(await r.json()).error.message||''}catch(e){}
    if(r.status===401)throw new Error('Cheia API nu e validă. Verific-o în Setări.');
    if(r.status===429)throw new Error('Prea multe cereri într-un timp scurt. Încearcă peste un minut.');
    if(r.status===413)throw new Error('Documentul e prea mare. Încearcă o poză mai mică sau un PDF mai scurt.');
    if(/credit/i.test(m))throw new Error('Contul Anthropic nu are credit. Adaugă credit în console.anthropic.com (separat de abonamentul Claude).');
    throw new Error('Eroare Anthropic '+r.status+(m?': '+m:''))}
  return r.json()}
const toolInput=(j,name)=>{const b=(j.content||[]).find(x=>x.type==='tool_use'&&x.name===name);if(!b)throw new Error('Răspuns neașteptat de la AI. Încearcă din nou.');return b.input||{}};
const textOf=j=>(j.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('\n');

/* ───── pregătirea fișierelor ───── */
async function scanReady(f){
  const isPdf=/pdf/i.test(f.type)||/\.pdf$/i.test(f.name||'');
  if(isPdf){if(f.size>20*1048576)throw new Error('PDF-ul are peste 20 MB. Folosește unul mai mic.');return {blob:f,mime:'application/pdf',pdf:true}}
  if(/^image\/(jpeg|png|webp)$/.test(f.type)&&f.size<1.5*1048576)return {blob:f,mime:f.type};
  try{const bmp=await createImageBitmap(f),k=Math.min(1,2000/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
    c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));if(b)return {blob:b,mime:'image/jpeg'}}catch(e){}
  if(/^image\/(jpeg|png|webp)$/.test(f.type))return {blob:f,mime:f.type};
  throw new Error('Format neacceptat. Folosește poze JPG/PNG sau PDF.')}
async function fileBlocks(files){
  const out=[];
  for(const f of files){const s=await scanReady(f),data=await blobToB64(s.blob);
    out.push(s.pdf?{type:'document',source:{type:'base64',media_type:'application/pdf',data}}:{type:'image',source:{type:'base64',media_type:s.mime,data}})}
  return out}

const LAB_ITEM={type:'object',properties:{param:{type:'string',description:'Denumirea parametrului exact ca pe buletin'},value:{type:'string',description:'Valoarea exact ca pe buletin (număr cu zecimale ca pe document, sau text ex. negativ)'},unit:{type:'string'},ref_min:{type:'string',description:'Limita inferioară a intervalului de referință, doar numărul; gol dacă nu există'},ref_max:{type:'string',description:'Limita superioară, doar numărul; gol dacă nu există'},ref_text:{type:'string',description:'Referință doar dacă e text (ex. Negativ) sau neclară'},uncertain:{type:'boolean',description:'true dacă valoarea sau referința nu se citesc sigur'}},required:['param','value']};

const SCAN_SYS='Ești un asistent care transcrie documente medicale în limba română pentru dosarul medical al unei familii. Copiezi exact ce scrie în document. Nu interpretezi, nu pui diagnostice, nu completezi ce lipsește și nu inventezi valori. Dacă ceva nu se citește sigur, marchează-l ca nesigur. Răspunzi exclusiv prin instrumentul oferit.';
const mapRow=v=>({param:v.param||'',val:v.value||'',u:v.unit||'',lo:v.ref_min||'',hi:v.ref_max||'',unsure:!!v.uncertain||(!!v.ref_text&&!v.ref_min&&!v.ref_max&&!isNaN(parseFloat(String(v.value).replace(',','.'))))});

async function scanLab(files){
  const blocks=await fileBlocks(files);
  const j=await claude({system:SCAN_SYS,tools:[TOOL_LAB],tool_choice:{type:'tool',name:TOOL_LAB.name},messages:[{role:'user',content:blocks.concat([{type:'text',text:'Extrage toate valorile din acest buletin de analize, împreună cu intervalul de referință de lângă fiecare. Păstrează ordinea din document.'}])}]});
  return toolInput(j,TOOL_LAB.name)}
async function scanDoc(files){
  const blocks=await fileBlocks(files);
  const j=await claude({system:SCAN_SYS,tools:[TOOL_DOC],tool_choice:{type:'tool',name:TOOL_DOC.name},messages:[{role:'user',content:blocks.concat([{type:'text',text:'Citește acest document medical și raportează conținutul lui. Dacă are valori de laborator, include-le în lab_values.'}])}]});
  return toolInput(j,TOOL_DOC.name)}

/* ───── potrivire cu agenda ───── */
function matchBy(list,name){const n=norm(name).replace(/\bdr\.?\s*/g,'').trim();if(!n)return null;return list.find(x=>{const m=norm(x.name).replace(/\bdr\.?\s*/g,'').trim();return m&&(m.indexOf(n)>=0||n.indexOf(m)>=0)})||null}
const okDate=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'')?d:'';

/* ───── scanare în formularul de analize ───── */
async function aiLab(el){
  const form=el.closest('form');if(!form)return;
  let files=Array.prototype.slice.call((form.elements.files&&form.elements.files.files)||[]);
  if(!files.length&&form.dataset.id){const ds=DB.docs.filter(d=>d.reportId===form.dataset.id);for(const d of ds){const b=await getBlob(d.id);if(b)files.push(b)}}
  if(!files.length){toast('Alege mai întâi poza sau PDF-ul buletinului, la „Buletin”.');return}
  aiConsent('Poza sau PDF-ul buletinului',async()=>{
    el.disabled=true;const t0=el.innerHTML;el.textContent='Se citește buletinul…';
    try{
      const r=await scanLab(files),rows=(r.values||[]).map(mapRow);
      if(!rows.length){toast('Nu am găsit valori în document.');return}
      const box=form.querySelector('.vrows');
      const have=$$('.vrow',box).filter(x=>$('[data-f=param]',x).value.trim()||$('[data-f=val]',x).value.trim());
      $$('.vrow',box).filter(x=>!have.includes(x)).forEach(x=>x.remove());
      const known=have.map(x=>norm($('[data-f=param]',x).value));
      let added=0;rows.forEach(x=>{if(known.indexOf(norm(x.param))>=0)return;box.insertAdjacentHTML('beforeend',rowHtml(x));if(x.unsure)box.lastElementChild.classList.add('unsure');added++});
      const d=okDate(r.collection_date);if(d&&form.elements.date)form.elements.date.value=d;
      const fc=matchBy(DB.facilities,r.laboratory||'');if(fc&&form.elements.facilityId&&!form.elements.facilityId.value)form.elements.facilityId.value=fc.id;
      const nn=form.elements.notes;if(r.notes&&nn&&!nn.value)nn.value=r.notes;
      let note=form.querySelector('.aihint');if(!note){note=document.createElement('div');note.className='callout warn aihint';box.parentElement.insertBefore(note,box)}
      note.innerHTML=`${ic('alert',16)}<div><b>${added} valori citite de AI.</b> Verifică fiecare cu buletinul înainte să salvezi. Rândurile cu margine galbenă sunt nesigure.${r.laboratory&&!fc?' Laborator citit: '+esc(r.laboratory)+'.':''}</div>`;
      note.scrollIntoView({block:'center',behavior:'smooth'});
    }catch(e){toast(e.message)}finally{el.disabled=false;el.innerHTML=t0}})}

/* ───── întrebări către AI ───── */
const CHAT_SYS='Ești un asistent care ajută o familie să înțeleagă și să organizeze dosarul medical. Răspunzi în română, clar, pentru un nespecialist. Nu pui diagnostice și nu recomanzi începerea, oprirea sau schimbarea tratamentelor: spui ce merită discutat cu medicul și ce întrebări să pună. Dacă observi ceva care ar putea fi urgent, spui explicit să se adreseze medicului sau serviciului de urgență. Te bazezi doar pe datele din dosar și spui când informația lipsește.';
function mdLite(t){
  const e=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split(/\n{2,}/).map(par=>{
    const ls=par.split('\n');

const OCR_SYS='Transcrii fidel documente medicale (poze sau PDF) în limba română. Copiezi tot textul vizibil, în ordinea din document, păstrând structura: titluri, paragrafe, liste. Pentru tabele scrie câte o linie pe rând, cu coloanele separate prin " | ". Ce nu se citește sigur scrii [ilizibil]. Nu rezumi, nu corectezi, nu interpretezi, nu adaugi nimic. Răspunzi doar cu textul transcris.';
const EXPLAIN_SYS='Explici documente medicale pe înțelesul unui nespecialist, în limba română. Structură: 1) Ce este documentul. 2) Ce conține important (valori sau concluzii, cu sensul lor pe scurt). 3) Ce pare în regulă și ce merită atenție. 4) Întrebări utile pentru medic. Nu pui diagnostice și nu recomanzi începerea, oprirea sau schimbarea tratamentelor. Dacă ceva nu se citește sigur sau lipsește, spui explicit. Dacă ceva pare urgent, spui să se adreseze medicului sau serviciului de urgență.';

function histPop(n){if(!n)return;HPEND+=n;if(HSCHED)return;HSCHED=true;Promise.resolve().then(()=>{HSCHED=false;const k=HPEND;HPEND=0;if(k>0&&HD>=k){HD-=k;HSKIP++;try{history.go(-k)}catch(e){}}})}
window.addEventListener('popstate',()=>{
  if(HSKIP>0){HSKIP--;return}

   Pentru mutarea datelor în altă aplicație sau pentru arhivare pe termen lung.
   Formate deschise: CSV (se deschide în Excel), JSON și fișierele originale. */
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRCT[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
function makeZip(files){
  const parts=[],cen=[];let off=0;const dt=new Date(),dosT=(dt.getHours()<<11)|(dt.getMinutes()<<5)|(dt.getSeconds()>>1),dosD=((dt.getFullYear()-1980)<<9)|((dt.getMonth()+1)<<5)|dt.getDate();
  for(const f of files){
    const nm=te.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,dosT,true);lh.setUint16(12,dosD,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);
    parts.push(lh.buffer,nm,f.data);
    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(12,dosT,true);ch.setUint16(14,dosD,true);ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cen.push(ch.buffer,nm);off+=30+nm.length+sz}
  const csize=cen.reduce((a,x)=>a+x.byteLength,0),end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,csize,true);end.setUint32(16,off,true);
  return new Blob(parts.concat(cen,[end.buffer]),{type:'application/zip'})}

  add('stil-de-viata.csv',csvOf([['Persoană','Obicei','Frecvență','Cantitate','Unitate','Durată','Început','Final','Actual','Note']].concat(DB.habits.map(h=>[pn(h.personId),h.name,h.freq,h.amount,h.unit,h.duration,h.start,h.end,hbCurrent(h)?'da':'nu',h.note]))));
  add('medici.csv',csvOf([['Nume','Specialități','Unități','Telefon','E-mail','Note']].concat(DB.doctors.map(d=>[d.name,(d.specialties||[]).join('; '),(d.facilityIds||[]).map(fname).join('; '),d.phone,d.email,d.notes]))));
  add('unitati.csv',csvOf([['Nume','Tip','Localitate','Adresă','Telefon','Note']].concat(DB.facilities.map(f=>[f.name,f.kind,f.city,f.address,f.phone,f.notes]))));
  const drows=[['Persoană','Data','Nume','Tip','Fișier în arhivă','Afecțiuni','Text citit de AI']],used={};
  for(const d of DB.docs){const b=await getBlob(d.id);let path='';
    if(b){const base='documente/'+safeName(pn(d.personId))+'/'+(d.date||'fara-data')+'_'+safeName(d.name);let p=base+ex(d.type==='audio'?audioMime(d):b.type),i=1;while(used[p])p=base+'_'+(++i)+ex(d.type==='audio'?audioMime(d):b.type);used[p]=1;path=p;files.push({name:p,data:new Uint8Array(await b.arrayBuffer())})}
    drows.push([pn(d.personId),d.date,d.name,d.tag,path,(d.conditionIds||[]).map(cname).join('; '),d.text||''])}
  add('documente.csv',csvOf(drows));
  return makeZip(files)}
